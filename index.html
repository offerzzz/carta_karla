<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para ti :></title>
    <style>
        /* Fondo más cálido y suave */
        body {
            background: linear-gradient(135deg, #fff3e0 0%, #ffe0b2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            cursor: pointer;
            perspective: 1000px; /* Para dar efecto 3D */
        }

        /* Sobre de la carta con efecto de profundidad */
        .envelope {
            position: relative;
            width: 300px;
            height: 200px;
            background-color: #ff8a80; /* Un rosa-coral más suave */
            border-radius: 0 0 15px 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            transition: all 0.6s ease;
            transform-style: preserve-3d;
        }

        .envelope:hover {
            transform: translateY(-5px) rotateX(5deg); /* Sutil elevación al pasar el mouse */
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        /* Solapa superior */
        .flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 150px solid transparent;
            border-right: 150px solid transparent;
            border-top: 110px solid #ff5252; /* Un tono más oscuro para la solapa */
            transform-origin: top;
            transition: transform 0.8s ease;
            z-index: 3;
        }

        /* Cuerpo del sobre */
        .envelope-body {
            position: absolute;
            bottom: 0;
            width: 0;
            height: 0;
            border-left: 150px solid #ff5252;
            border-right: 150px solid #ff5252;
            border-bottom: 120px solid #e53935; /* Tono más fuerte en la base */
            border-radius: 0 0 15px 15px;
            z-index: 2;
        }

        /* Carta interior que se desliza */
        .letter {
            position: absolute;
            bottom: 5px; /* Un poco más arriba para que se vea al abrir */
            left: 15px;
            width: 270px;
            height: 160px;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: transform 1s ease-in-out 0.3s;
            z-index: 1;
            padding: 20px;
            box-sizing: border-box;
        }

        .tulips {
            font-size: 40px; /* Tulipanes un poco más grandes */
            margin-bottom: 15px;
            opacity: 0;
            transform: scale(0.5); /* Aparecen creciendo */
            transition: all 0.7s ease 0.9s;
        }

        .message {
            font-size: 18px;
            color: #c2185b;
            font-weight: 600;
            text-align: center;
            line-height: 1.4;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.7s ease 1.1s;
        }

        /* ESTADO ABIERTO: Animaciones al hacer clic */
        .open .flap {
            transform: rotateX(180deg);
            z-index: 0;
        }

        .open .letter {
            transform: translateY(-110px); /* Sube más la carta */
            z-index: 4;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .open .tulips {
            opacity: 1;
            transform: scale(1);
        }

        .open .message {
            opacity: 1;
            transform: translateY(0);
        }

        /* Instrucción */
        .instruction {
            margin-top: 40px;
            color: #880e4f;
            font-size: 16px;
            letter-spacing: 1px;
            font-weight: 500;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        /* Importar fuente bonita */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap');
    </style>
</head>
<body>

    <div class="container" onclick="toggleCard()">
        <div class="envelope" id="envelope">
            <div class="flap"></div>
            <div class="envelope-body"></div>
            <div class="letter">
                <div class="tulips">🌷🌷🌷</div>
                <div class="message">Me alegro mucho de estarte conociendo :></div>
            </div>
        </div>
        <div class="instruction">🌷 Haz clic con cariño 🌷</div>
    </div>

    <script>
        function toggleCard() {
            const envelope = document.getElementById('envelope');
            envelope.classList.toggle('open');
        }
    </script>

</body>
</html>
